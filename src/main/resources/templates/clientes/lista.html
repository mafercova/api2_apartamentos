<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body class="app-body">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>
<main class="app-shell py-5">
    <div class="page-header"><div><p class="eyebrow">DIRECTORIO</p><h1>Clientes</h1><p class="page-lede">Personas y organizaciones vinculadas a tu operación.</p></div><a class="btn btn-accent" th:href="@{/clientes/nuevo}">+ Nuevo cliente</a></div>
    <div class="row g-4 management-grid">
<section class="col-lg-4"><div class="panel p-4 quick-form" id="registro"><h2 class="h5 mb-3">Registrar cliente</h2><div th:replace="~{clientes/formulario :: registro}"></div></div></section>
<section class="col-lg-8" data-catalog><div class="panel p-3 p-md-4"><div class="catalog-header"><h2 class="h5 mb-0">Clientes registrados <span class="record-count" th:text="${#lists.size(clientes)}">0</span></h2><label class="search-box"><span class="visually-hidden">Buscar en clientes</span><input class="form-control form-control-sm" type="search" data-search placeholder="Buscar en clientes…"></label></div>
<div class="table-wrap">
        <table class="table table-hover align-middle mb-0"><thead><tr><th>Cliente</th><th>Contacto</th><th>Tipo</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
        <tbody><tr th:if="${#lists.isEmpty(clientes)}"><td colspan="5" class="empty-table">No hay clientes para mostrar.</td></tr>
        <tr data-record th:each="cliente : ${clientes}"><td><div class="d-flex align-items-center gap-3"><div class="initials" th:text="${#strings.substring(cliente.nombres, 0, 1) + #strings.substring(cliente.apellidos, 0, 1)}">CL</div><div><strong th:text="${cliente.nombres + ' ' + cliente.apellidos}">Nombre</strong><small class="d-block text-muted" th:text="${cliente.ine != null ? 'INE ' + cliente.ine : 'Sin INE'}">INE</small></div></div></td><td><span th:text="${cliente.email}">email</span><small class="d-block text-muted" th:text="${cliente.telefono != null ? cliente.telefono : 'Sin teléfono'}">teléfono</small></td><td th:text="${cliente.tipo}">CLIENTE</td><td><span class="badge-status" th:text="${cliente.estatus}">ACTIVO</span></td><td class="text-end"><a class="action-link" data-edit-dialog th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar</a><form class="d-inline" th:action="@{/clientes/{id}/eliminar(id=${cliente.id})}" method="post"><button class="action-link action-danger" type="submit">Eliminar</button></form></td></tr><tr data-no-results hidden><td colspan="5" class="empty-table">No se encontraron resultados para tu búsqueda.</td></tr></tbody></table>
    </div></div></section></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer><script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
