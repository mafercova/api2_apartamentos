<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modo} + ' unidad rentable')}"></head>
<body class="app-body"><nav th:replace="~{fragments/layout :: navbar}"></nav><div th:replace="~{fragments/layout :: alerts}"></div>
<main class="app-shell py-5 form-page"><a class="back-link" th:href="@{/unidades}">← Volver a unidades</a><div class="page-header compact"><div><p class="eyebrow">INVENTARIO</p><h1 th:text="${modo + ' unidad rentable'}">Crear unidad</h1></div></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<form th:fragment="registro" class="form-surface" th:object="${unidad}" th:action="${modo == 'Crear'} ? @{/unidades} : @{/unidades/{id}(id=${unidad.idUnidad})}" method="post"><div class="row g-4"><div class="col-md-6"><label class="form-label" for="propiedadId">Propiedad</label><select id="propiedadId" class="form-select" name="propiedadId" required><option value="">Selecciona una propiedad</option><option th:each="propiedad : ${propiedades}" th:value="${propiedad.idPropiedad}" th:selected="${unidad.propiedad != null and unidad.propiedad.idPropiedad == propiedad.idPropiedad}" th:text="${propiedad.titulo + ' · ' + propiedad.ciudad}"></option></select></div><div class="col-md-6"><label class="form-label" for="nombre">Nombre de la unidad</label><input class="form-control" th:field="*{nombre}" required><div class="field-error" th:errors="*{nombre}"></div></div><div class="col-md-6"><label class="form-label" for="tipo">Tipo</label><input class="form-control" th:field="*{tipo}" placeholder="Habitación, apartamento..." required><div class="field-error" th:errors="*{tipo}"></div></div><div class="col-md-3"><label class="form-label" for="capacidad">Capacidad</label><input class="form-control" type="number" min="1" th:field="*{capacidad}" required><div class="field-error" th:errors="*{capacidad}"></div></div><div class="col-md-3"><label class="form-label" for="precioNoche">Precio por noche</label><input class="form-control" type="number" min="0.01" step="0.01" th:field="*{precioNoche}" required><div class="field-error" th:errors="*{precioNoche}"></div></div><div class="col-md-6"><label class="form-label" for="estado">Estado</label><select class="form-select" th:field="*{estado}"><option value="DISPONIBLE">DISPONIBLE</option><option value="NO_DISPONIBLE">NO_DISPONIBLE</option><option value="MANTENIMIENTO">MANTENIMIENTO</option></select></div></div><div class="form-actions"><a class="btn btn-light" th:href="@{/unidades}">Cancelar</a><button class="btn btn-accent" type="submit" th:text="${modo + ' unidad'}">Guardar</button></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:replace="~{fragments/layout :: scripts}"></script></body></html>
