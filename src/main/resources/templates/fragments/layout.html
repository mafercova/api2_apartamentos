<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Apartamentos'">Apartamentos</title>
    <link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container-fluid app-shell">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="brand-mark">APARTAMENTOS</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Abrir navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Resumen</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/propiedades}">Propiedades</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/unidades}">Unidades</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reservas}">Reservas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/pagos}">Pagos</a></li>
<li class="nav-item"><a class="nav-link" th:href="@{/reportes}">Reportes</a></li>
                <li class="nav-item"><a class="btn btn-accent btn-sm px-3" th:href="@{/propiedades/nueva}">Nueva propiedad</a></li>
            </ul>
        </div>
    </div>
</nav>
<div th:fragment="alerts" class="app-shell pt-3">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>
<footer th:fragment="footer" class="app-shell py-4 mt-auto text-muted small">
    <div class="footer-rule"></div>
    <div class="d-flex justify-content-between pt-3"><span>Panel de gestión</span><span>Propiedades · Reservas · Pagos</span></div>
</footer>
<th:block th:fragment="scripts">
<div class="modal fade" id="editDialog" tabindex="-1" aria-labelledby="editDialogTitle" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="editDialogTitle">Editar registro</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body" id="editDialogBody"></div></div></div></div>
<script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}" defer></script>
</th:block>
</body>
</html>
